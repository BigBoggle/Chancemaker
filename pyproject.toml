[project]
name = "Chancemaker"
version = "0.0.1"
requires-python = ">=3.14"

dependencies = [
    "flask>=3.1,<4",
    "flask-sqlalchemy>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "black>=25.1",
    "flake8",
    "Flake8-pyproject",
    "pytest>=8.0",
    "pyright",
]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.pyright]
pythonVersion = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[tool.flake8]
max-line-length = 88
max-complexity = 10
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    ".pytest_cache",
]
extend-ignore = ["E203", "W503", "E701", "E704"]
count = true
show-source = true
statistics = true
